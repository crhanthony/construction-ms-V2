<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b365d">
  <title>BuildTrack - Construction Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e8800c'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%8F%97%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <section id="login-view" class="login-wrap" hidden>
    <form id="login-form" class="login-card" novalidate>
      <div class="logo"><span class="logo-mark" aria-hidden="true">&#127959;</span><div><h1>BuildTrack</h1><span class="muted small">Construction Management System</span></div></div>
      <div id="login-msg" class="banner error" role="alert" hidden></div>
      <label for="lg-user">Username</label>
      <input id="lg-user" name="username" autocomplete="username" autofocus>
      <span class="err" data-for="username"></span>
      <label for="lg-pass">Password</label>
      <div class="pw-wrap">
        <input id="lg-pass" name="password" type="password" autocomplete="current-password">
        <button type="button" id="pw-toggle" class="pw-toggle" aria-label="Show password">Show</button>
      </div>
      <span class="err" data-for="password"></span>
      <button class="btn primary block" type="submit">Log in</button>
      <div class="demo-box">
        <b>Demo accounts</b> <span class="muted small">(click to fill)</span>
        <div class="chips" id="demo-chips"></div>
      </div>
    </form>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Open menu">&#9776;</button>
      <strong class="brand"><span class="logo-mark" aria-hidden="true">&#127959;</span>BuildTrack</strong><span id="page-title" class="page-title"></span>
      <span class="spacer"></span>
      <button id="theme-btn" class="icon-btn show" aria-label="Switch light/dark theme" title="Switch theme">&#9790;</button>
      <span id="who" class="who"></span>
      <button id="logout-btn" class="btn ghost">Logout</button>
    </header>
    <div class="layout">
      <nav id="sidebar" class="sidebar" aria-label="Main"></nav>
      <div id="backdrop" class="backdrop"></div>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal" class="overlay" hidden><div class="dialog" role="dialog" aria-modal="true" id="dialog"></div></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
